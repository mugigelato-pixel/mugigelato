<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Mugi Gelato — El Yapımı İtalyan Gelato, Beşiktaş İstanbul. Taze ve doğal malzemelerle hazırlanan butik dondurma.">
  <meta name="theme-color" content="#0B0B14">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>mugi — Artisan Gelato</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/menu.css">
</head>
<body>

  <!-- Language Toggle -->
  <div class="lang-toggle" id="langToggle">
    <button class="lang-btn active" data-lang="tr" id="langBtnTr">TR</button>
    <button class="lang-btn" data-lang="en" id="langBtnEn">EN</button>
  </div>

  <!-- Hero Section -->
  <section class="menu-hero hero-gradient" id="menuHeroSection">
    <div class="hero-bg-media" id="heroBgMedia"></div>
    <div class="hero-bg-overlay" id="heroBgOverlay"></div>
    <img src="logo1.jpg" alt="Mugi Gelato" class="hero-logo animate-fade-in-up">
    <p class="hero-tagline animate-fade-in-up stagger-2" id="heroTagline">El Yapımı İtalyan Gelato</p>
  </section>

  <!-- Search Bar -->
  <div class="search-container animate-fade-in-up stagger-3">
    <div class="search-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Lezzet ara...">
    </div>
  </div>

  <!-- Category Navigation -->
  <nav class="category-nav" id="categoryNav">
    <div class="category-scroll" id="categoryScroll">
      <!-- Dynamically populated -->
    </div>
  </nav>

  <!-- Products Section -->
  <main class="products-section" id="productsSection">
    <div class="products-grid" id="productsGrid">
      <!-- Dynamically populated -->
    </div>
  </main>

  <!-- Product Detail Modal -->
  <div class="modal-overlay" id="productModal">
    <div class="modal-content">
      <div class="modal-handle"></div>
      <button class="modal-close" id="modalClose">✕</button>
      <div id="modalImageContainer"></div>
      <div class="modal-body">
        <h2 class="modal-name" id="modalName"></h2>
        <p class="modal-description" id="modalDescription"></p>
        <div class="modal-tags" id="modalTags"></div>
        <div class="modal-prices" id="modalPrices"></div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="menu-footer">
    <div class="footer-brand">mugi</div>
    <div class="footer-info">
      <div class="footer-item">
        <span class="footer-label" data-i18n="address_label">Adres</span>
        <span class="footer-value" id="footerAddress">Türkali Mah., Ihlamurdere Cad., No: 121/A, Beşiktaş, İstanbul</span>
      </div>
      <div class="footer-item" id="footerPhoneItem" style="display:none;">
        <span class="footer-label">Telefon</span>
        <span class="footer-value" id="footerPhone"></span>
      </div>
      <div class="footer-item">
        <span class="footer-label" data-i18n="hours_label">Çalışma Saatleri</span>
        <span class="footer-value" id="footerHours">11:00 – 23:00</span>
      </div>
    </div>
    <div class="footer-social">
      <a href="https://www.instagram.com/mugigelato/" target="_blank" rel="noopener" class="social-link" id="footerInstagram">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
        <span>@mugigelato</span>
      </a>
    </div>
    <p class="footer-credit">
      <span>♥</span> <span data-i18n="made_with">sevgiyle yapıldı</span>
    </p>
  </footer>

  <script src="js/store.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
